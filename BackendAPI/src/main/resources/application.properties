# Application Info
spring.application.name=BackendAPI
server.port=9090

# --- PostgreSQL Datasource Configuration ---
# The JDBC URL for connecting to the PostgreSQL container.
# The hostname 'db' matches the service name in docker-compose.yml, allowing the containers to communicate.
spring.datasource.url=jdbc:postgresql://db:5432/myappdb

# The PostgreSQL JDBC driver class name
spring.datasource.driverClassName=org.postgresql.Driver

# These credentials should match the ones in docker-compose.yml.
# They are also set as environment variables in the compose file, which will override these values.
spring.datasource.username=myuser
spring.datasource.password=mypassword

# --- JPA & Hibernate Configuration ---
# The dialect tells Hibernate how to generate the correct SQL for PostgreSQL.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# This property manages the database schema.
# "update" automatically creates or updates tables based on your @Entity classes when the application starts.
# This is very useful for development.
spring.jpa.hibernate.ddl-auto=update


# --- Order Status Manager Configuration (Unchanged) ---
# How often the scheduler runs to check for new orders (e.g., every 60 seconds)
app.scheduler.fixed-delay-ms=60000

# Time to wait before changing status from PREPARING to SHIPPING
app.shipping.delay.min-ms=5000
app.shipping.delay.max-ms=15000

# Thresholds for determining the final outcome
# If outcome time is < this value, it's DELIVERED
app.outcome.time.delivered-max-ms=20000
# If outcome time is > delivered-max but < this value, it's DELAYED
app.outcome.time.delayed-max-ms=40000
# If outcome time is > this value (or negative), it's LOST