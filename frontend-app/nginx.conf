server {
  listen 80;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # Existing rule for your application's API
  location /api/ {
    proxy_pass http://backend:9090;
    proxy_set_header Host $host;
    # ... other headers
  }

  location /images/ {
    proxy_pass http://backend:9090;
    proxy_set_header Host $host;
  }

  # --- NEW RULES FOR SWAGGER ---
  # Forward the main Swagger UI path
  location /swagger-ui/ {
    proxy_pass http://backend:9090;
    proxy_set_header Host $host;
  }
  # Forward the API docs JSON file that Swagger UI needs
  location /v3/api-docs {
    proxy_pass http://backend:9090;
    proxy_set_header Host $host;
  }
}